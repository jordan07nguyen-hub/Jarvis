[tool.poetry]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS AI assistant backend — FastAPI service providing chat, memory, and plugin/tool calling for the macOS app."
authors = ["Jarvis Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "jarvis_backend" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
anthropic = "^0.39.0"
httpx = "^0.27.0"
websockets = "^13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
